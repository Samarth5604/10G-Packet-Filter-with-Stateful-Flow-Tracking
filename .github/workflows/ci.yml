# Runs everything that needs no proprietary toolchain: spec validation, the
# golden model, the stimulus round-trip, the CRC derivation, the generated-docs
# and generated-RTL staleness gates, and the Verilator differential regression.
#
# Vivado is not available here, so `make synth` stays out of scope: post-route
# timing is produced locally and committed under reports/ as evidence
# (docs/adr/0006-scope-freeze.md).
#
# The differential run is deliberately small. Its value here is that it is
# REPRODUCIBLE BY A THIRD PARTY -- vectors derive from a profile and a seed, so
# anyone can regenerate the exact packets this job checked. The volume runs
# (1M packets) stay local; a CI job is evidence the claim is checkable, not the
# claim itself.

name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      # packet_filter.opam is generated by dune from the package stanza in
      # dune-project, but is committed: opam reads it before dune has run.
      - run: opam install . --deps-only --with-test

      - run: opam exec -- make derive
      - run: opam exec -- make model
      - run: opam exec -- make stimulus
      - run: opam exec -- make crc
      - run: opam exec -- make flowtable

      # Documentation is generated. A stale committed copy is a build failure,
      # not a silently wrong document.
      - run: opam exec -- make docs-check

      # The generated RTL is committed so synthesis and clones work without an
      # opam switch. Regenerate and fail if it differs from what is checked in.
      - name: rtl is up to date
        run: |
          opam exec -- dune build @all
          opam exec -- dune exec bin/gen_rtl.exe > /tmp/header_parser.v
          opam exec -- dune exec bin/gen_crc.exe  > /tmp/crc32_par.v
          opam exec -- dune exec bin/gen_crc.exe -- --ooc > /tmp/crc32_par_ooc.v
          diff -u rtl/header_parser.v  /tmp/header_parser.v
          diff -u rtl/crc32_par.v      /tmp/crc32_par.v
          diff -u rtl/crc32_par_ooc.v  /tmp/crc32_par_ooc.v

      # --- differential regression ---------------------------------------
      # Verilator from apt is older than the local OSS CAD Suite build, which
      # is why sim/Makefile probes for --timing rather than hardcoding it.
      #
      # cocotb goes into the SYSTEM python deliberately. cocotb sets PYTHONHOME
      # to the interpreter it embeds in the simulator; Verilator then runs its
      # own helper script with /usr/bin/python3. With actions/setup-python those
      # are different versions, the helper inherits a PYTHONHOME pointing at the
      # wrong stdlib, and it dies with "No module named 'encodings'" during the
      # C++ build -- after Verilator has already compiled the RTL successfully,
      # which makes it look like a simulator problem rather than a Python one.
      # One interpreter, no collision.
      - name: install verilator and cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator python3-pip
          verilator --version
          python3 --version
          # PEP 668 marks the system python as externally managed; on a
          # throwaway runner that is exactly what we want to override. cocotb
          # 1.9.2 ships a cp312 wheel, so this is a download, not a source build.
          pip install --break-system-packages -r requirements.txt || \
            pip install -r requirements.txt
          python3 -c "import cocotb; print('cocotb', cocotb.__version__)"
          # cocotb-config must resolve, or sim/Makefile cannot find the cocotb
          # makefiles and fails with a confusing "no rule to make target".
          cocotb-config --makefiles

      - name: differential regression
        run: opam exec -- make sim VEC_COUNT=20000

      # results.xml records which tests ran and their status. Kept so a failing
      # run can be inspected without reproducing it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-results
          path: |
            sim/results.xml
            sim/vectors.txt
          retention-days: 7