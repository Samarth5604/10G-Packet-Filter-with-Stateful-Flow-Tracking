# Runs everything that needs no FPGA toolchain: spec validation, the golden
# model, the stimulus round-trip, the CRC derivation, and the generated-docs
# staleness gate.
#
# Vivado is not available here, so `make synth` is out of scope: post-route
# timing is produced locally and committed under reports/ as evidence
# (docs/adr/0006-scope-freeze.md).

name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      # packet_filter.opam is generated by dune from the package stanza in
      # dune-project, but is committed: opam reads it before dune has run.
      - run: opam install . --deps-only --with-test

      - run: opam exec -- make derive
      - run: opam exec -- make model
      - run: opam exec -- make stimulus
      - run: opam exec -- make crc

      # Documentation is generated. A stale committed copy is a build failure,
      # not a silently wrong document.
      - run: opam exec -- make docs-check

      # The generated RTL is committed so synthesis and clones work without an
      # opam switch. Regenerate and fail if it differs from what is checked in.
      - name: rtl is up to date
        run: |
          opam exec -- dune build @all
          opam exec -- dune exec bin/gen_rtl.exe > /tmp/header_parser.v
          opam exec -- dune exec bin/gen_crc.exe  > /tmp/crc32_par.v
          opam exec -- dune exec bin/gen_crc.exe -- --ooc > /tmp/crc32_par_ooc.v
          diff -u rtl/crc32_par_ooc.v /tmp/crc32_par_ooc.v
          diff -u rtl/header_parser.v /tmp/header_parser.v
          diff -u rtl/crc32_par.v     /tmp/crc32_par.v
